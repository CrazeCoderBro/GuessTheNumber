<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Guess the Number Game</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f4f4f4; }
    h1 { color: #333; }
    .btn { padding: 10px 20px; margin: 5px; cursor: pointer; border-radius: 6px; border: none; color: white; }
    .mode1 { background: #4CAF50; }
    .mode2 { background: #2196F3; }
    .mode3 { background: #FF9800; }
    .mode4 { background: #9C27B0; }
    .mode5 { background: #F44336; }
    #result { margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Guess the Number Game</h1>

  <div>
    <button class="btn mode1" onclick="startGame(100)">1-100</button>
    <button class="btn mode2" onclick="startGame(1000)">1-1,000</button>
    <button class="btn mode3" onclick="startGame(10000)">1-10,000</button>
    <button class="btn mode4" onclick="startGame(100000)">1-100,000</button>
    <button class="btn mode5" onclick="startGame(1000000)">1-1,000,000</button>
  </div>

  <div id="gameArea" style="margin-top:20px; display:none;">
    <p>Enter your guess:</p>
    <input type="number" id="guessInput">
    <button onclick="checkGuess()">Guess</button>
    <p id="feedback"></p>
    <p id="rangeHint"></p>
    <p>Attempts: <span id="attempts">0</span></p>
  </div>

  <div id="result"></div>

  <script>
    let secretNumber = 0;
    let maxNumber = 100;
    let minNumber = 1;
    let attempts = 0;

    function startGame(max) {
      maxNumber = max;
      minNumber = 1;
      secretNumber = Math.floor(Math.random() * maxNumber) + 1;
      attempts = 0;

      document.getElementById('gameArea').style.display = 'block';
      document.getElementById('feedback').textContent = '';
      document.getElementById('result').textContent = '';
      document.getElementById('rangeHint').textContent = `Guess a number between ${minNumber} and ${maxNumber}`;
      document.getElementById('attempts').textContent = attempts;

      console.log('Secret Number:', secretNumber); // for testing
    }

    function checkGuess() {
      const guess = parseInt(document.getElementById('guessInput').value);
      attempts++;
      document.getElementById('attempts').textContent = attempts;

      if(guess === secretNumber) {
        document.getElementById('result').textContent = `🎉 Correct! You found it in ${attempts} attempts!`;
        document.getElementById('feedback').textContent = '';
        document.getElementById('rangeHint').textContent = '';
        return;
      }

      if(maxNumber <= 1000) {
        // progressive hints for smaller numbers
        if(guess < secretNumber) minNumber = Math.max(minNumber, guess+1);
        else maxNumber = Math.min(maxNumber, guess-1);
        document.getElementById('rangeHint').textContent = `Try a number between ${minNumber} and ${maxNumber}`;
      } else {
        document.getElementById('rangeHint').textContent = '';
      }

      document.getElementById('feedback').textContent = guess < secretNumber ? 'Too low! 🔽' : 'Too high! 🔼';
    }
  </script>
</body>
</html>
